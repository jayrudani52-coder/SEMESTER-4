<!DOCTYPE html>
<html>
<head><title>Edit Student</title></head>
<body>
    <a href="{% url 'home' %}">Cancel and Return</a>
    <hr>
    <h2>Modify Student Record</h2>
    <form method="POST">
        {% csrf_token %}
        <input type="text" name="name" value="{{ student.name }}" required><br><br>
        <input type="text" name="roll_number" value="{{ student.roll_number }}" required><br><br>
        <input type="email" name="email" value="{{ student.email }}" required><br><br>
        <input type="text" name="phone" value="{{ student.phone }}"><br><br>
        <input type="text" name="department" value="{{ student.department }}" required><br><br>
        <input type="number" step="0.01" name="gpa" value="{{ student.gpa }}" required><br><br>
        <input type="text" name="status" value="{{ student.status }}" required><br><br>

        <button type="submit">Update Record</button>
    </form>
</body>
</html>
