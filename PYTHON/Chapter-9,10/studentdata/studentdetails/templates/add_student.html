<!DOCTYPE html>
<html>
<head><title>Add Student</title></head>
<body>
    <a href="{% url 'home' %}">Back to Home</a>
    <hr>
    <h2>Add New Student</h2>
    <form method="POST">
        {% csrf_token %}
        <input type="text" name="name" placeholder="Full Name" required><br><br>
        <input type="text" name="roll_number" placeholder="Roll Number" required><br><br>
        <input type="email" name="email" placeholder="Email Address" required><br><br>
        <input type="text" name="phone" placeholder="Phone Number"><br><br>
        <input type="text" name="department" placeholder="Department (e.g. Computer Science)" required><br><br>
        <input type="number" step="0.01" name="gpa" placeholder="GPA" required><br><br>
        <input type="text" name="status" placeholder="Status (e.g. Active, On Leave)" required><br><br>

        <button type="submit">Save Student Record</button>
    </form>
</body>
</html>
